name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Launcher and model-input checks (no game or weights)
        run: python3 -m unittest discover -s tests -v
      - name: Public source audit
        run: python3 scripts/audit-public-tree.py
